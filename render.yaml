services:
  - type: web
    name: ghostbuster
    runtime: node
    rootDir: ghostbuster-server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: "production"
      - key: APP_URL
        value: "https://ghostbuster-ai-js5l.onrender.com"
      - key: GOOGLE_LOGIN_REDIRECT_URI
        value: "https://ghostbuster-ai-js5l.onrender.com/api/auth/google/callback"
      - key: GOOGLE_REDIRECT_URI
        value: "https://ghostbuster-ai-js5l.onrender.com/api/google/callback"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
